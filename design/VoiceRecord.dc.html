<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice note recorder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 400px; border-radius: 50%; overflow: hidden; background: #000; color: #F2F1EC; font-family: Inter, sans-serif">
<svg width="400" height="400" viewBox="0 0 400 400" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="{{path}}" fill="none" stroke="{{ring}}" stroke-width="3" stroke-linecap="round"></path>
</svg>

<sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 0; top: 78px; width: 400px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; color: #9A9A94">{{clock}}</div>
<button type="button" aria-label="Start recording" onClick="{{start}}" style="position: absolute; left: 140px; top: 128px; width: 120px; height: 120px; border: 0; border-radius: 50%; background: {{accent}}; color: #141413; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v3"></path></svg>
</button>
<div style="position: absolute; left: 0; top: 270px; width: 400px; text-align: center; font-size: 15px; font-weight: 600">Tap, or press BACK</div>
<div style="position: absolute; left: 0; top: 296px; width: 400px; text-align: center; font-size: 13px; color: #9A9A94">2 notes waiting to send</div>
</sc-if>

<sc-if value="{{isRec}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 92px; width: 400px; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #FF5A4E">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #FF5A4E"></span>REC
</div>
<div style="position: absolute; left: 0; top: 114px; width: 400px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 72px; font-weight: 600; line-height: 1; letter-spacing: -0.02em">{{dur}}</div>
<div style="position: absolute; left: 0; top: 196px; width: 400px; text-align: center; font-size: 12px; color: #9A9A94">{{fname}}</div>
<button type="button" aria-label="Stop and save" onClick="{{stop}}" style="position: absolute; left: 156px; top: 230px; width: 88px; height: 88px; border: 0; border-radius: 50%; background: #FF5A4E; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 28px; height: 28px; border-radius: 6px; background: #141413"></span>
</button>
<div style="position: absolute; left: 0; top: 332px; width: 400px; text-align: center; font-size: 12px; color: #9A9A94">Screen can turn off</div>
</sc-if>

<sc-if value="{{isSaved}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 168px; top: 84px; width: 64px; height: 64px; border-radius: 50%; background: #1C1C1A; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
</div>
<div style="position: absolute; left: 0; top: 160px; width: 400px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">Saved · {{dur}}</div>
<div style="position: absolute; left: 0; top: 198px; width: 400px; text-align: center; font-size: 12px; color: #9A9A94">{{fname}}</div>
<div style="position: absolute; left: 0; top: 218px; width: 400px; text-align: center; font-size: 13px; color: {{accent}}">Queued · sends on home Wi-Fi</div>
<button type="button" onClick="{{again}}" style="position: absolute; left: 130px; top: 260px; width: 140px; height: 52px; border: 0; border-radius: 999px; background: #1C1C1A; color: #F2F1EC; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">New note</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5CD6E0","#B9F26B"]},"$preview":{"width":400,"height":400}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mode: 'idle', start: 0, end: 0, now: Date.now(), tick: 0 };
}
componentDidMount() {
this.iv = setInterval(() => this.setState({ now: Date.now(), tick: this.state.tick + 1 }), 160);
}
componentWillUnmount() {
clearInterval(this.iv);
}
renderVals() {
const accent = this.props.accent ?? '#FFB547';
const s = this.state;
const pad = (n) => String(n).padStart(2, '0');
const fmt = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)); return pad(Math.floor(t / 60)) + ':' + pad(t % 60); };
const d = new Date(s.start || s.now);
const off = -d.getTimezoneOffset();
const oa = Math.abs(off);
const fname = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '_' + pad(d.getHours()) + '-' + pad(d.getMinutes()) + '-' + pad(d.getSeconds()) + (off >= 0 ? '+' : '-') + pad(Math.floor(oa / 60)) + pad(oa % 60) + '.m4a';
const n = new Date(s.now);
const clock = pad(n.getHours()) + ':' + pad(n.getMinutes());
const rec = s.mode === 'rec';
let path = '';
for (let i = 0; i < 60; i++) {
const a = (i * 6 - 90) * Math.PI / 180;
const amp = rec ? Math.abs(Math.sin(i * 1.7 + s.tick * 0.9) * Math.cos(i * 0.45 - s.tick * 0.6)) : 0;
const r1 = 170, r2 = 174 + amp * 16;
path += 'M' + (200 + r1 * Math.cos(a)).toFixed(1) + ' ' + (200 + r1 * Math.sin(a)).toFixed(1) + 'L' + (200 + r2 * Math.cos(a)).toFixed(1) + ' ' + (200 + r2 * Math.sin(a)).toFixed(1);
}
return {
accent, clock, fname, path,
isIdle: s.mode === 'idle', isRec: rec, isSaved: s.mode === 'saved',
dur: fmt(rec ? s.now - s.start : s.end - s.start),
ring: rec ? '#FF5A4E' : '#2A2A27',
start: () => this.setState({ mode: 'rec', start: Date.now(), now: Date.now() }),
stop: () => this.setState({ mode: 'saved', end: Date.now() }),
again: () => this.setState({ mode: 'idle', start: 0 })
};
}
}
</script>
</body>
</html>
