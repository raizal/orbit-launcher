<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 400px; border-radius: 50%; overflow: hidden; background: #000; color: #F2F1EC; font-family: Inter, sans-serif">
<svg width="400" height="400" viewBox="0 0 400 400" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path id="notTop" d="M71.3 92 A168 168 0 0 1 328.7 92" fill="none"></path>
<text font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="2.5" fill="{{accent}}"><textPath href="#notTop" startOffset="50%" text-anchor="middle">3 NEW</textPath></text>
</svg>
<div style="position: absolute; left: 56px; top: 70px; width: 288px; box-sizing: border-box; padding: 16px 18px; border-radius: 28px; background: #1C1C1A; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9A9A94">
<span style="width: 22px; height: 22px; border-radius: 50%; background: #5CD6E0; color: #141413; display: flex; align-items: center; justify-content: center">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
</span>
<span>Messages · now</span>
</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Ayu</div>
<div style="font-size: 15px; line-height: 1.4; color: #D8D7D1">Lunch at 12? I'll book the place near the office.</div>
</div>
<button type="button" aria-label="Reply" style="position: absolute; left: 128px; top: 254px; width: 60px; height: 60px; border: 0; border-radius: 50%; background: {{accent}}; color: #141413; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v3"></path></svg>
</button>
<button type="button" aria-label="Dismiss" style="position: absolute; left: 212px; top: 254px; width: 60px; height: 60px; border: 0; border-radius: 50%; background: #232321; color: #F2F1EC; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</button>
<div style="position: absolute; left: 92px; top: 334px; width: 216px; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 22px; background: #141413; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9A9A94">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>
<span>Standup in 10 min</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5CD6E0","#B9F26B"]},"$preview":{"width":400,"height":400}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FFB547' };
}
}
</script>
</body>
</html>
