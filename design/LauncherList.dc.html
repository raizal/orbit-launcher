<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App launcher curved list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 400px; border-radius: 50%; overflow: hidden; background: #000; color: #F2F1EC; font-family: Inter, sans-serif">
<svg width="400" height="400" viewBox="0 0 400 400" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path id="listTop" d="M71.3 92 A168 168 0 0 1 328.7 92" fill="none"></path>
<text font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="2.5" fill="#9A9A94"><textPath href="#listTop" startOffset="50%" text-anchor="middle">APPS · A–Z</textPath></text>
<path d="M378.5 135 A190 190 0 0 1 378.5 265" fill="none" stroke="#262624" stroke-width="5" stroke-linecap="round"></path>
<path d="M378.5 135 A190 190 0 0 1 378.5 265" fill="none" stroke="#F2F1EC" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="28 100" stroke-dashoffset="-22"></path>
</svg>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
<button type="button" style="position: absolute; left: {{row.left}}px; top: {{row.top}}px; width: {{row.w}}px; height: {{row.h}}px; box-sizing: border-box; border: 0; border-radius: 999px; padding: 0 0 0 {{row.pad}}px; background: {{row.bg}}; color: #F2F1EC; opacity: {{row.op}}; display: flex; align-items: center; gap: 14px; font-family: Inter, sans-serif; font-size: {{row.fs}}px; font-weight: {{row.fw}}; text-align: left">
<span style="width: {{row.icon}}px; height: {{row.icon}}px; flex-shrink: 0; border-radius: 50%; background: {{row.ibg}}; color: {{row.ifg}}; display: flex; align-items: center; justify-content: center">
<svg width="{{row.g}}" height="{{row.g}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{row.d}}"></path></svg>
</span>
<span>{{row.n}}</span>
</button>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5CD6E0","#B9F26B"]},"$preview":{"width":400,"height":400}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#FFB547';
const items = [
['Calculator', 'M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM8 6h8M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01'],
['Calendar', 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'],
['Camera', 'M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3zM12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z'],
['Compass', 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z'],
['Contacts', 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z']
];
const ys = [70, 132, 200, 268, 330];
const rows = items.map((it, i) => {
const dy = ys[i] - 200;
const focus = dy === 0;
const icon = focus ? 56 : (Math.abs(dy) < 100 ? 46 : 38);
const h = focus ? 72 : icon;
const edge = 200 - Math.sqrt(178 * 178 - dy * dy);
const left = Math.round(edge + (focus ? 18 : 34));
return {
n: it[0], d: it[1], icon, g: Math.round(icon * 0.46), h,
top: Math.round(ys[i] - h / 2), left, w: 352 - left,
pad: focus ? 8 : 0,
bg: focus ? '#1C1C1A' : 'transparent',
ibg: focus ? accent : '#232321', ifg: focus ? '#141413' : '#F2F1EC',
fs: focus ? 20 : 16, fw: focus ? 600 : 500,
op: focus ? 1 : (Math.abs(dy) < 100 ? 0.85 : 0.5)
};
});
return { rows };
}
}
</script>
</body>
</html>
