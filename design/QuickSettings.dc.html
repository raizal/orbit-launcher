<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 400px; border-radius: 50%; overflow: hidden; background: #000; color: #F2F1EC; font-family: Inter, sans-serif">
<svg width="400" height="400" viewBox="0 0 400 400" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="M107 361.1 A186 186 0 0 0 293 361.1" fill="none" stroke="#262624" stroke-width="8" stroke-linecap="round"></path>
<path d="M107 361.1 A186 186 0 0 0 293 361.1" fill="none" stroke="#F2F1EC" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="60 100"></path>
</svg>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9A94" stroke-width="2.4" stroke-linecap="round" style="position: absolute; left: 82px; top: 338px" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="6">
<button type="button" aria-label="{{t.n}}" aria-pressed="{{t.on}}" onClick="{{t.flip}}" style="position: absolute; left: {{t.left}}px; top: {{t.top}}px; width: 72px; height: 72px; border: 0; padding: 0; border-radius: 50%; background: {{t.bg}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
</button>
</sc-for>
<div style="position: absolute; left: 130px; top: 152px; width: 140px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 600; line-height: 1">76%</span>
<span style="font-size: 13px; color: #9A9A94">about 2 days</span>
<span style="font-size: 12px; font-weight: 600; color: {{accent}}; margin-top: 6px; letter-spacing: 0.06em">{{status}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5CD6E0","#B9F26B"]},"$preview":{"width":400,"height":400}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: { wifi: true, bt: true, dnd: false, light: false, gps: false, sound: true } };
}
renderVals() {
const accent = this.props.accent ?? '#FFB547';
const defs = [
['wifi', 'Wi-Fi', 'M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 20 0M12 20h.01'],
['bt', 'Bluetooth', 'm7 7 10 10-5 5V2l5 5L7 17'],
['dnd', 'Do not disturb', 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z'],
['light', 'Screen light', 'M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z'],
['gps', 'Location', 'M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0ZM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z'],
['sound', 'Sound', 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0']
];
const on = this.state.on;
const toggles = defs.map((d, i) => {
const a = (-90 + i * 60) * Math.PI / 180;
const x = 200 + 124 * Math.cos(a), y = 200 + 124 * Math.sin(a);
const isOn = !!on[d[0]];
return {
n: d[1], d: d[2], on: isOn ? 'true' : 'false',
left: Math.round(x - 36), top: Math.round(y - 36),
bg: isOn ? accent : '#232321', fg: isOn ? '#141413' : '#F2F1EC',
flip: () => this.setState({ on: { ...on, [d[0]]: !isOn } })
};
});
const status = on.dnd ? 'DO NOT DISTURB' : (on.wifi ? 'WI-FI + LTE' : 'LTE ONLY');
return { toggles, accent, status };
}
}
</script>
</body>
</html>
