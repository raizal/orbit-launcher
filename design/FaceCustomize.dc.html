<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customize complication</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 400px; border-radius: 50%; overflow: hidden; background: #000; color: #F2F1EC; font-family: Inter, sans-serif">
<svg width="400" height="400" viewBox="0 0 400 400" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="M67.06 332.94 A188 188 0 1 1 332.94 332.94" fill="none" stroke="#1A1A18" stroke-width="8" stroke-linecap="round"></path>
<path id="custTop" d="M71.3 92 A168 168 0 0 1 328.7 92" fill="none"></path>
<text font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="2.5" fill="{{accent}}"><textPath href="#custTop" startOffset="50%" text-anchor="middle">SLOT 1 OF 3</textPath></text>
<path id="custBottom" d="M71.3 308 A168 168 0 0 0 328.7 308" fill="none"></path>
<text font-family="Inter, sans-serif" font-size="12" font-weight="500" letter-spacing="1.5" fill="#9A9A94"><textPath href="#custBottom" startOffset="50%" text-anchor="middle">TURN OR SWIPE TO CHANGE · BACK TO SAVE</textPath></text>
</svg>
<div style="position: absolute; left: 0; top: 130px; width: 400px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 108px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; color: #1F1F1D">10:08</div>
<div style="position: absolute; left: 64px; top: 112px; width: 272px; height: 104px; box-sizing: border-box; border-radius: 28px; background: #1C1C1A; display: flex; align-items: center; justify-content: space-between; padding: 0 6px">
<button type="button" aria-label="Previous data source" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: #9A9A94; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
<span style="font-size: 17px; font-weight: 600">Weather</span>
<span style="font-size: 12px; color: #9A9A94">3 of 9</span>
</div>
<button type="button" aria-label="Next data source" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: #9A9A94; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</div>
<div style="position: absolute; left: 92px; top: 250px; width: 72px; height: 72px; border-radius: 50%; border: 3px solid {{accent}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<div style="width: 58px; height: 58px; border-radius: 50%; background: #161615; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600">31°</span>
</div>
</div>
<div style="position: absolute; left: 170px; top: 256px; width: 60px; height: 60px; border-radius: 50%; border: 2px dashed #4A4A46; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: #6E6E69">2</div>
<div style="position: absolute; left: 242px; top: 256px; width: 60px; height: 60px; border-radius: 50%; border: 2px dashed #4A4A46; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: #6E6E69">3</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5CD6E0","#B9F26B"]},"$preview":{"width":400,"height":400}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FFB547' };
}
}
</script>
</body>
</html>
