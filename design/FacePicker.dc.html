<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Face picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 400px; border-radius: 50%; overflow: hidden; background: #000; color: #F2F1EC; font-family: Inter, sans-serif">
<svg width="400" height="400" viewBox="0 0 400 400" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path id="pickTop" d="M71.3 92 A168 168 0 0 1 328.7 92" fill="none"></path>
<text font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="2.5" fill="#9A9A94"><textPath href="#pickTop" startOffset="50%" text-anchor="middle">ORBIT · 1 / 4</textPath></text>
</svg>
<div style="position: absolute; left: -120px; top: 110px; width: 160px; height: 160px; border-radius: 50%; background: #0E0E0D; border: 2px solid #262624; display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; box-sizing: border-box; opacity: 0.6">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600; color: #9A9A94">+</span>
</div>
<div style="position: absolute; left: 360px; top: 110px; width: 160px; height: 160px; border-radius: 50%; background: #0E0E0D; border: 2px solid #262624; opacity: 0.6"></div>
<div style="position: absolute; left: 368px; top: 160px; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #9A9A94; opacity: 0.6"></div>
<div style="position: absolute; left: 90px; top: 74px; width: 220px; height: 220px; border-radius: 50%; background: #000; border: 3px solid {{accent}}; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 12px; letter-spacing: 0.12em; color: #9A9A94">THU 28</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 58px; font-weight: 600; line-height: 1; letter-spacing: -0.03em">10:08</span>
<div style="display: flex; gap: 8px; margin-top: 8px">
<div style="width: 28px; height: 28px; border-radius: 50%; background: #1C1C1A"></div>
<div style="width: 28px; height: 28px; border-radius: 50%; background: #1C1C1A"></div>
<div style="width: 28px; height: 28px; border-radius: 50%; background: #1C1C1A"></div>
</div>
</div>
<svg width="400" height="400" viewBox="0 0 400 400" style="position: absolute; left: 0; top: 0; pointer-events: none" aria-hidden="true">
<path d="M127.2 272.8 A103 103 0 1 1 272.8 272.8" fill="none" stroke="{{accent}}" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="68 100" transform="translate(0 -16)"></path>
</svg>
<button type="button" style="position: absolute; left: 125px; top: 312px; width: 150px; height: 48px; border: 0; border-radius: 999px; background: #1C1C1A; color: #F2F1EC; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
Customize
</button>
<div style="position: absolute; left: 0; top: 372px; width: 400px; display: flex; justify-content: center; gap: 6px">
<div style="width: 16px; height: 6px; border-radius: 3px; background: {{accent}}"></div>
<div style="width: 6px; height: 6px; border-radius: 3px; background: #4A4A46"></div>
<div style="width: 6px; height: 6px; border-radius: 3px; background: #4A4A46"></div>
<div style="width: 6px; height: 6px; border-radius: 3px; background: #4A4A46"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5CD6E0","#B9F26B"]},"$preview":{"width":400,"height":400}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FFB547' };
}
}
</script>
</body>
</html>
