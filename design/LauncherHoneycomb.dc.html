<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App launcher honeycomb</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 400px; border-radius: 50%; overflow: hidden; background: #000; color: #F2F1EC; font-family: Inter, sans-serif">
<sc-for list="{{apps}}" as="item" hint-placeholder-count="19">
<button type="button" aria-label="{{item.n}}" style="position: absolute; left: {{item.left}}px; top: {{item.top}}px; width: {{item.size}}px; height: {{item.size}}px; border: 0; padding: 0; border-radius: 50%; background: {{item.bg}}; color: {{item.fg}}; opacity: {{item.op}}; display: flex; align-items: center; justify-content: center">
<svg width="{{item.g}}" height="{{item.g}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
</button>
</sc-for>
<div style="position: absolute; left: 0; top: 366px; width: 400px; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #9A9A94">VOICE NOTE</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"spacing":{"editor":"range","default":82,"min":70,"max":96,"step":1,"unit":"px"},"$preview":{"width":400,"height":400}}'>
class Component extends DCLogic {
renderVals() {
const N = '#232321', L = '#F2F1EC', D = '#141413';
const icons = [
['Voice note', '#FFB547', D, 'M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v3'],
['Phone', '#5CD6E0', D, 'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z'],
['Messages', N, L, 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'],
['Email', N, '#5CD6E0', 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM22 6l-10 7L2 6'],
['Workout', '#FFB547', D, 'M22 12h-4l-3 9L9 3l-3 9H2'],
['Music', N, L, 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z'],
['Camera', N, L, 'M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3zM12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z'],
['Maps', N, L, 'M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0ZM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z'],
['Weather', N, '#FFB547', 'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41'],
['Timer', N, L, 'M10 2h4M12 14l3-3M12 22a8 8 0 1 0 0-16 8 8 0 0 0 0 16z'],
['Alarm', N, L, 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0'],
['Calendar', N, L, 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'],
['Compass', N, L, 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z'],
['Gallery', N, L, 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM21 15l-5-5L5 21M9 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z'],
['Flashlight', N, L, 'M13 2 3 14h9l-1 8 10-12h-9l1-8z'],
['Calculator', N, L, 'M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM8 6h8M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01'],
['Contacts', N, L, 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'],
['Sleep', N, L, 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z'],
['Settings', N, L, 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6']
];
const cells = [[0, 0]];
const dirs = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
for (let ring = 1; ring <= 2; ring++) {
let q = -ring, r = ring;
for (let side = 0; side < 6; side++) {
for (let k = 0; k < ring; k++) {
cells.push([q, r]);
q += dirs[side][0]; r += dirs[side][1];
}
}
}
const sp = this.props.spacing ?? 82;
const apps = cells.map(([q, r], i) => {
const x = 200 + sp * (q + r / 2);
const y = 196 + sp * 0.866 * r;
const d = Math.hypot(x - 200, y - 196);
const scale = Math.max(0.38, 1 - (d * d) / 60000);
const size = Math.round(72 * scale);
const ic = icons[i % icons.length];
return {
n: ic[0], bg: ic[1], fg: ic[2], d: ic[3],
size, g: Math.round(size * 0.44),
left: Math.round(x - size / 2), top: Math.round(y - size / 2),
op: d > 150 ? 0.7 : 1
};
});
return { apps };
}
}
</script>
</body>
</html>
